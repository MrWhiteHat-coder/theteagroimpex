[build]
  publish = "."
  functions = "netlify/functions"

# ---- Block server/config files from public access ----
# force = true is required: without it Netlify serves the real file if it exists
[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/generate-sitemap.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

# Enquiry API
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Catalogue page
[[redirects]]
  from = "/products"
  to = "/products.html"
  status = 200

# Individual product detail pages: /products/<slug> -> product.html shell
# (title/meta/schema are then set dynamically by product-detail.js)
[[redirects]]
  from = "/products/:slug"
  to = "/product.html"
  status = 200

# Branded 404 for everything else (single-page, no-linkrot friendly)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
